<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adoption · Alegra</title>
<link rel="icon" href="https://cdn1.alegra.com/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* ══ SISTEMA DE COLOR ══
   Marca, superficies, texto, bordes, estados, radios y sombras salen del
   Smile Design System de Alegra (alegra.design/kit/tokens.json): primario teal
   #30bbb7, neutrales slate, semánticos success/warning/error/info.

   Los colores de DATOS (--series-*, --blue, --purple) NO son de marca: son una
   paleta categórica validada (ΔE CVD adyacente ≥8, visión normal ≥15) para que
   los analistas se distingan entre sí incluso con daltonismo. La marca de Alegra
   es un solo teal y no sirve para eso, así que esa paleta se conserva tal cual.

   Modo CLARO por defecto (así se ven los productos Alegra); oscuro es opcional. */
:root{
  /* Superficies — escala neutral (slate) de Alegra */
  --bg:#f1f5f9;                 /* semantic.page */
  --surface:#ffffff;            /* semantic.container */
  --surface2:#f8fafc;           /* surface.subtle */
  --surface3:#e9eef4;           /* surface.regular, opaco para tracks/barras */
  --brd:#e2e8f0;                /* border.subtle */
  --brd2:#f1f5f9;               /* separador interno, más suave */
  /* Texto */
  --t1:#0f172a;                 /* text.primary */
  --t2:#334155;                 /* text.secondary */
  --t3:#64748b;                 /* text.tertiary */
  /* Marca Alegra */
  --brand:#30aba9;              /* primary.600 — el del botón */
  --brand-d:#299e9c;            /* primary.700 — hover */
  --brand-l:#eafafa;            /* primary.50 — fondo sutil */
  --brand-brd:rgba(48,171,169,.5);
  --brand-ink:#ffffff;          /* texto sobre el teal */

  /* Estados — semánticos de Alegra. Se usan las variantes que, además de ser del
     sistema, alcanzan ≥3:1 contra blanco: así sirven como texto Y como relleno. */
  --g:#16a34a;--gbg:#dcfce7;--gbrd:rgba(22,163,74,.35);
  --a:#d97706;--abg:#fef3c7;--abrd:rgba(217,119,6,.38);
  --r:#e11d48;--rbg:#ffe4e6;--rbrd:rgba(225,29,72,.35);

  /* ── Colores de DATOS (no de marca): paleta categórica validada ── */
  --blue:#2a78d6;--blue-bg:rgba(42,120,214,.08);--blue-brd:rgba(42,120,214,.3);
  --purple:#4a3aa7;--purple-bg:rgba(74,58,167,.08);--purple-brd:rgba(74,58,167,.3);

  --series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;
  --series-4:#eda100;--series-5:#e87ba4;--series-6:#008300;--series-7:#4a3aa7;--series-8:#e34948;
  /* 9-10: fuera del set de 8 validado — tonos distintos, sin la misma garantía CVD */
  --series-9:#4f7d7d;--series-10:#7d5a7d;
  --series-other:#7a7972;--series-unassigned:#9b9a94;
  /* Tinta del texto sobre cada fill (blanco u oscuro, el que dé más contraste) */
  --series-1-ink:#0b0b0b;--series-2-ink:#0b0b0b;--series-3-ink:#0b0b0b;
  --series-4-ink:#0b0b0b;--series-5-ink:#0b0b0b;--series-6-ink:#fff;--series-7-ink:#fff;--series-8-ink:#0b0b0b;
  --series-9-ink:#fff;--series-10-ink:#fff;
  --series-other-ink:#0b0b0b;--series-unassigned-ink:#0b0b0b;

  /* Chrome de gráficos — recesivo, nunca compite con los datos */
  --chart-grid:#e2e8f0;--chart-axis:#cbd5e1;--chart-muted:#64748b;
  --delta-good:#15803d;--delta-bad:#be123c;

  /* Sombras y radios — escala Alegra */
  --sh:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);
  --sh2:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --rad:12px;                   /* radius.xl — cards */
  --rad-sm:8px;                 /* radius.lg — botones, chips */
  --rad-lg:16px;                /* radius.2xl — modales y contenedores */
  --overlay:rgba(51,65,85,.6);  /* scrim de modal, según el DS */
}
:root[data-theme="dark"]{
  --bg:#0f172a;--surface:#1e293b;--surface2:#243447;--surface3:#334155;
  --brd:#334155;--brd2:#293548;
  --t1:#f1f5f9;--t2:#cbd5e1;--t3:#94a3b8;
  --brand:#30bbb7;--brand-d:#72d5d1;--brand-l:rgba(48,187,183,.12);
  --brand-brd:rgba(48,187,183,.35);--brand-ink:#052e2e;

  --g:#4ade80;--gbg:rgba(74,222,128,.14);--gbrd:rgba(74,222,128,.35);
  --a:#fbbf24;--abg:rgba(251,191,36,.14);--abrd:rgba(251,191,36,.38);
  --r:#fb7185;--rbg:rgba(251,113,133,.14);--rbrd:rgba(251,113,133,.35);

  --blue:#3987e5;--blue-bg:rgba(57,135,229,.13);--blue-brd:rgba(57,135,229,.35);
  --purple:#9085e9;--purple-bg:rgba(144,133,233,.13);--purple-brd:rgba(144,133,233,.35);

  --series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;
  --series-4:#c98500;--series-5:#d55181;--series-6:#008300;--series-7:#9085e9;--series-8:#e66767;
  --series-9:#6fa3a3;--series-10:#a682a6;
  --series-other:#8b8a84;--series-unassigned:#5f5e58;
  --series-1-ink:#0b0b0b;--series-2-ink:#0b0b0b;--series-3-ink:#0b0b0b;
  --series-4-ink:#0b0b0b;--series-5-ink:#0b0b0b;--series-6-ink:#fff;--series-7-ink:#0b0b0b;--series-8-ink:#0b0b0b;
  --series-9-ink:#0b0b0b;--series-10-ink:#0b0b0b;
  --series-other-ink:#0b0b0b;--series-unassigned-ink:#fff;

  --chart-grid:#293548;--chart-axis:#3a4a5c;--chart-muted:#94a3b8;
  --delta-good:#4ade80;--delta-bad:#fb7185;

  --sh:0 1px 3px 0 rgba(0,0,0,.4),0 1px 2px -1px rgba(0,0,0,.4);
  --sh2:0 20px 25px -5px rgba(0,0,0,.5),0 8px 10px -6px rgba(0,0,0,.5);
  --overlay:rgba(2,6,23,.7);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
a{color:var(--brand);text-decoration:none;}
button{font:inherit;cursor:pointer;}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--brd);padding:0 24px;position:sticky;top:0;z-index:100;}
.hdr-inner{max-width:1500px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;flex-wrap:wrap;}
.hdr-l{display:flex;align-items:center;gap:12px;}
.logo{display:flex;align-items:center;height:28px;}
.logo svg{height:28px;width:auto;display:block;}
.hdr-div{width:1px;height:26px;background:var(--brd);}
.hdr-title{font-size:15px;font-weight:700;}
.hdr-sub{font-size:11px;color:var(--t2);}
.hdr-r{display:flex;align-items:center;gap:8px;}

.btn{background:var(--surface2);border:1px solid var(--brd);border-radius:9px;padding:8px 14px;color:var(--t2);font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--surface3);color:var(--t1);}
.btn-primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
.btn-primary:hover{background:var(--brand-d);color:var(--brand-ink);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--brand-l);color:var(--brand);border:1px solid var(--brand-brd);}

.main{max-width:1500px;margin:0 auto;padding:22px 24px 60px;display:grid;gap:20px;}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.kpi{background:var(--surface);border:1px solid var(--brd);border-radius:var(--rad);padding:16px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);}
.kpi.k-ok::before{background:var(--g);}.kpi.k-warn::before{background:var(--a);}.kpi.k-bad::before{background:var(--r);}.kpi.k-blue::before{background:var(--blue);}.kpi.k-purple::before{background:var(--purple);}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);}
.kpi-num{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:5px 0 2px;line-height:1;}
.kpi-sub{font-size:11px;color:var(--t3);}

/* HERO KPI (stat-tile con sparkline — vista "Este mes") */
.kpi-hero-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;}
.kpi-hero{background:var(--surface);border:1px solid var(--brd);border-radius:var(--rad);padding:14px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:1px;}
.kpi-hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);}
.kpi-hero.k-blue::before{background:var(--blue);}.kpi-hero.k-ok::before{background:var(--g);}.kpi-hero.k-purple::before{background:var(--purple);}.kpi-hero.k-warn::before{background:var(--a);}
.kpi-hero-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);}
.kpi-hero-val{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;margin:6px 0 2px;font-variant-numeric:proportional-nums;}
.kpi-hero-sub{font-size:11px;color:var(--t3);min-height:14px;}
.kpi-hero-spark{margin-top:8px;height:26px;}

/* PANEL */
.panel{background:var(--surface);border:1px solid var(--brd);border-radius:var(--rad);overflow:hidden;}
.panel-hd{padding:15px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.panel-bd{padding:18px;}
.stitle{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.ssub{font-size:12px;color:var(--t2);margin-top:2px;}

/* FILTERS */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);}
.inp,select.inp{background:var(--surface2);border:1px solid var(--brd);border-radius:8px;color:var(--t1);font:inherit;font-size:13px;padding:7px 10px;width:100%;transition:border-color .15s;}
.inp:focus{border-color:var(--brand);outline:none;}
.row2{display:flex;gap:6px;}

/* CHIPS */
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--surface2);border:1px solid var(--brd);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--t2);transition:all .15s;}
.chip:hover{border-color:var(--brand-brd);color:var(--t1);}
.chip.active{background:var(--brand-l);border-color:var(--brand-brd);color:var(--brand);}

/* TABLE */
.tbl-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--t2);padding:10px 14px;border-bottom:1px solid var(--brd);white-space:nowrap;background:var(--surface2);position:sticky;top:0;}
td{padding:10px 14px;border-bottom:1px solid var(--brd2);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface2);}
.tc{text-align:center;}.tr{text-align:right;}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap;}
.t-g{background:var(--gbg);color:var(--g);border:1px solid var(--gbrd);}
.t-a{background:var(--abg);color:var(--a);border:1px solid var(--abrd);}
.t-r{background:var(--rbg);color:var(--r);border:1px solid var(--rbrd);}
.t-b{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-brd);}
.t-gr{background:var(--surface3);color:var(--t2);border:1px solid var(--brd);}

/* BAR (group-by result) */
.gbar-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:5px 0;}
.gbar-lbl{font-size:13px;font-weight:600;color:var(--t1);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gbar-track{background:var(--surface3);border-radius:99px;height:24px;overflow:hidden;position:relative;}
.gbar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-d),var(--brand));min-width:2px;transition:width .4s;}
.gbar-val{font-size:13px;font-weight:700;min-width:70px;text-align:right;}

/* MES DELTA */
.mes-delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
.mes-delta-good{color:var(--delta-good);}
.mes-delta-bad{color:var(--delta-bad);}
.mes-delta-flat{color:var(--t3);}

/* MONTH STEPPER */
.month-stepper{display:flex;align-items:center;gap:6px;}
.step-btn{width:32px;height:32px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--brd);border-radius:8px;color:var(--t2);font-size:15px;font-weight:700;flex-shrink:0;}
.step-btn:hover:not(:disabled){background:var(--surface3);color:var(--t1);border-color:var(--brand-brd);}
.step-btn:disabled{opacity:.35;cursor:not-allowed;}

/* CHART CARD (contenedor SVG + leyenda + tooltip) */
.chart-card{background:var(--surface);border:1px solid var(--brd);border-radius:var(--rad);overflow:hidden;}
.chart-card-hd{padding:16px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.chart-card-bd{padding:8px 20px 18px;position:relative;}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:2px 20px 0;}
.chart-legend-item{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--t2);}
.chart-legend-key{width:14px;height:3px;border-radius:2px;flex-shrink:0;}
.chart-legend-key.dot{width:9px;height:9px;border-radius:50%;}
.chart-svg{display:block;width:100%;height:auto;overflow:visible;}
.chart-svg text{font-family:inherit;}

/* TOOLTIP (chart hover) */
.chart-tt{position:absolute;pointer-events:none;background:var(--surface2);border:1px solid var(--brd);border-radius:8px;padding:9px 12px;font-size:12px;box-shadow:var(--sh2);z-index:5;min-width:130px;transition:opacity .08s;}
.chart-tt-title{font-weight:700;color:var(--t1);margin-bottom:6px;font-size:12px;}
.chart-tt-row{display:flex;align-items:center;gap:7px;justify-content:space-between;padding:1px 0;}
.chart-tt-key{display:flex;align-items:center;gap:6px;color:var(--t2);}
.chart-tt-line{width:11px;height:2px;border-radius:1px;flex-shrink:0;}
.chart-tt-val{font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;}

/* MULTI-BAR (ranking: 2 métricas por categoría, valor SIEMPRE fuera de la barra) */
.rank-rows{display:flex;flex-direction:column;}
.rank-row{display:grid;grid-template-columns:126px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--brd2);}
.rank-row:last-child{border-bottom:none;padding-bottom:2px;}
.rank-row:first-child{padding-top:2px;}
.rank-name{font-size:13px;font-weight:700;color:var(--t1);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-bars{display:flex;flex-direction:column;gap:5px;}
.rank-bar-line{display:flex;align-items:center;gap:8px;}
.rank-bar-track{flex:1;background:var(--surface3);border-radius:5px;height:13px;overflow:hidden;}
.rank-bar-fill{height:100%;border-radius:5px;min-width:2px;transition:width .35s;}
.rank-bar-num{font-size:11px;font-weight:700;color:var(--t1);min-width:30px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0;}
.rank-stats{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:11px;color:var(--t3);flex-wrap:wrap;}
.rank-stat b{color:var(--t1);font-weight:700;}
.rank-stat-sep{color:var(--brd);}

/* SLA SEMÁFORO (vs. promedio del equipo, no hay meta absoluta aún) */
.sla-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;flex-shrink:0;}

/* STAGE FUNNEL (embudo por etapa + SLA de esa etapa) */
.stage-funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.stage-tile{background:var(--surface2);border:1px solid var(--brd);border-radius:var(--rad-sm);padding:12px 14px;}
.stage-tile-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.stage-tile-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.stage-tile-num{font-size:20px;font-weight:800;color:var(--t1);font-variant-numeric:proportional-nums;}
.stage-bar-track{height:6px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-bottom:8px;}
.stage-bar-fill{height:100%;border-radius:99px;min-width:2px;transition:width .35s;}
.stage-tile-sla{font-size:11px;color:var(--t2);}
.stage-tile-sla b{color:var(--t1);font-weight:700;}
.stage-alert{margin-top:7px;font-size:10.5px;color:var(--r);font-weight:600;line-height:1.4;}
.stage-alert-ok{color:var(--g);}

/* METER (bullet-style: track = BOP, fill 1 = atendidos, cap = completados) */
.meter{position:relative;height:9px;border-radius:99px;background:var(--surface3);overflow:visible;margin-top:8px;}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue);opacity:.55;}
.meter-cap{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--g);}
.meter-lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-top:5px;}

/* VIEW TABS */
.vtabs{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--brd);border-radius:10px;padding:4px;}
.vtab{border:0;background:none;padding:8px 18px;border-radius:8px;font-weight:600;font-size:13px;color:var(--t2);}
.vtab:hover{color:var(--t1);}
.vtab.active{background:var(--brand);color:var(--brand-ink);}

/* ANALISTA CARDS */
.cards-analistas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.acard{overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.acard:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--brand-brd);}
.acard-dc{font-size:10px;color:var(--t3);text-align:center;padding:0 0 10px;}
.acard-conv{font-size:10px;color:var(--t3);margin-top:2px;}

/* MODAL (drill-down) */
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:200;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border:1px solid var(--brd);border-radius:var(--rad-lg);max-width:900px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--sh2);}
.modal-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--brd);position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-x{margin-left:auto;background:var(--surface2);border:1px solid var(--brd);border-radius:8px;width:32px;height:32px;color:var(--t2);font-size:16px;}
.modal-x:hover{color:var(--t1);background:var(--surface3);}
.acard-hd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--brd);}
.acard-av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;}
.acard-nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acard-main{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:13px 12px;text-align:center;}
.acard-big{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em;}
.acard-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--t2);margin-top:5px;}
.acard-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--brd2);font-size:11px;color:var(--t2);flex-wrap:wrap;}

.hint{font-size:12px;color:var(--t3);}
.muted{color:var(--t3);}
.ftr{text-align:center;color:var(--t3);font-size:11px;padding:8px 0;}

/* LOGIN */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--brd);border-radius:var(--rad);padding:32px;width:100%;max-width:360px;box-shadow:var(--sh2);}
.login-card h1{font-size:19px;margin-bottom:6px;}
.login-card p{font-size:13px;color:var(--t2);margin-bottom:20px;}
.err{color:var(--r);font-size:12px;margin-top:8px;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ══ FASE C · CLARIDAD ══ */

/* Barra de controles compartida por Resumen / Operación / Equipo */
.ctrl-bar{padding:12px 16px;}
.ctrl-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.fg-inline{min-width:150px;}
.ctrl-hint{font-size:11px;color:var(--t3);margin-top:8px;}

/* El titular: la frase que se entiende en 10 segundos */
.titular{background:var(--surface);border:1px solid var(--brd);border-left:4px solid var(--brand);border-radius:var(--rad);padding:18px 22px;}
.titular-mes{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.titular p{font-size:19px;line-height:1.55;color:var(--t1);font-weight:400;max-width:76ch;}
.titular p b{font-weight:700;}
.titular-nota{margin-top:12px;font-size:12px;color:var(--t2);background:var(--abg);border:1px solid var(--abrd);border-radius:var(--rad-sm);padding:8px 12px;}
.txt-good{color:var(--delta-good);}
.txt-bad{color:var(--delta-bad);}

/* Leyenda fija del semáforo (antes solo se veía al pasar el mouse) */
.semaforo-leyenda{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--brd);border-radius:var(--rad-sm);padding:9px 14px;font-size:12px;color:var(--t2);}
.semaforo-leyenda b{color:var(--t1);}
.semaforo-leyenda span{display:inline-flex;align-items:center;gap:6px;}
.semaforo-leyenda i{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* Filtros de uso ocasional, plegados */
.mas-filtros{border-top:1px solid var(--brd2);}
.mas-filtros summary{cursor:pointer;padding:10px 18px;font-size:12px;font-weight:600;color:var(--t2);list-style:none;user-select:none;}
.mas-filtros summary::-webkit-details-marker{display:none;}
.mas-filtros summary::before{content:'▸ ';color:var(--t3);}
.mas-filtros[open] summary::before{content:'▾ ';}
.mas-filtros summary:hover{color:var(--t1);}

/* Número clicable dentro del titular (lleva al desglose) */
.link-num{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--brand-d);border-bottom:1.5px solid var(--brand-brd);cursor:pointer;}
.link-num:hover{color:var(--brand);border-bottom-color:var(--brand);}

/* Desglose de los abiertos del mes */
.desglose-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 28px;}
.desglose-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:9px;}

.chip-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;}
.modal-wide{max-width:1080px;}

/* Explorador de métricas */
.explorer-ctrl{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:0 18px 12px;}
.explorer-metricas{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 12px;border-bottom:1px solid var(--brd2);}
.explorer-nota{font-size:11.5px;color:var(--t2);background:var(--surface2);border-bottom:1px solid var(--brd2);padding:9px 18px;}
.explorer-sub{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);padding:12px 18px 0;}
.leyenda-filtrable button{background:none;border:none;padding:2px 0;cursor:pointer;}
.leyenda-filtrable .chart-legend-item.off{opacity:.45;text-decoration:line-through;}
.leyenda-filtrable .link-reset{color:var(--brand-d);font-weight:600;text-decoration:underline;}

/* Aviso de datos fuera del tablero */
.aviso-datos{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--abg);border:1px solid var(--abrd);border-radius:var(--rad);padding:11px 16px;font-size:12.5px;color:var(--t2);}
.aviso-datos b{color:var(--t1);}

/* Título de sección entre paneles */
.seccion-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:10px 0 -6px;}

/* Controles propios de cada gráfica */
.panel-ctrl{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:0 18px 12px;border-bottom:1px solid var(--brd2);}

/* Contexto extra en tooltip y tabla (tickets detrás del número) */
.chart-tt-meta{font-size:10.5px;color:var(--t3);padding-left:19px;margin:-2px 0 5px;}
.chart-tt-total{display:flex;justify-content:space-between;gap:18px;font-size:12px;font-weight:700;
  color:var(--t1);padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--brd);}
.celda-meta{font-size:10px;color:var(--t3);font-weight:400;margin-top:1px;}

/* Embudo del mes */
.funnel-wrap{display:flex;flex-direction:column;gap:4px;}
.funnel-paso{display:flex;align-items:center;gap:14px;}
.funnel-lbl{width:230px;font-size:13px;color:var(--t2);text-align:right;flex-shrink:0;}
.funnel-track{flex:1;height:34px;background:var(--surface3);border-radius:var(--rad-sm);position:relative;overflow:hidden;}
.funnel-fill{height:100%;border-radius:var(--rad-sm);transition:width .45s;}
.funnel-n{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.funnel-pct{width:52px;font-size:16px;font-weight:800;text-align:right;flex-shrink:0;}
.funnel-gap{margin:4px 0 4px 244px;display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;}
.funnel-pend{color:var(--a);}
.funnel-perd{color:var(--r);}
.funnel-cierre{margin-top:14px;padding-top:13px;border-top:1px solid var(--brd2);font-size:13.5px;color:var(--t2);line-height:1.6;}
.funnel-cierre b{color:var(--t1);}
@media(max-width:720px){.funnel-lbl{width:120px;font-size:12px}.funnel-gap{margin-left:134px;gap:8px}}
</style>
