<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alegra Connect integral</title>
<style>
:root{
  --bg:#f6f8fa;--card:#ffffff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--soft:#f1f5f9;
  --brand:#30bbb7;--brand-ink:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --s1:#30bbb7;--s2:#6366f1;--s3:#f59e0b;--s4:#94a3b8;--s5:#ec4899;
  --okbg:#dcfce7;--warnbg:#fef3c7;--badbg:#fee2e2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--line:#334155;--soft:#273449;
  --brand:#3fcfca;--brand-ink:#5eead4;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --s1:#3fcfca;--s2:#818cf8;--s3:#fbbf24;--s4:#64748b;--s5:#f472b6;
  --okbg:#14532d;--warnbg:#713f12;--badbg:#7f1d1d;}}
:root[data-theme="dark"]{
  --bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--line:#334155;--soft:#273449;
  --brand:#3fcfca;--brand-ink:#5eead4;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --s1:#3fcfca;--s2:#818cf8;--s3:#fbbf24;--s4:#64748b;--s5:#f472b6;
  --okbg:#14532d;--warnbg:#713f12;--badbg:#7f1d1d;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;z-index:5}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.sub{color:var(--muted);font-size:12px}
.sp{flex:1}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
button{cursor:pointer}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{border:none;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--brand);color:#fff;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.filters label{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
main{padding:18px 20px;max-width:1280px;margin:0 auto}
.q{font-size:20px;font-weight:700;margin:0 0 4px}
.headline{background:var(--soft);border-left:4px solid var(--brand);padding:10px 14px;border-radius:8px;margin:8px 0 16px}
.grid{display:grid;gap:12px}
.k{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:14px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .c{font-size:12px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}.neu{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left}
.scroll{overflow:auto;max-height:560px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.pbad{background:var(--badbg);color:var(--bad)}.pwarn{background:var(--warnbg);color:var(--warn)}.pok{background:var(--okbg);color:var(--ok)}
.pmut{background:var(--soft);color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.info{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--soft);color:var(--muted);text-align:center;font-size:11px;line-height:16px;cursor:help;margin-left:4px;font-weight:700}
.funnel .row{display:grid;grid-template-columns:170px 1fr 120px;gap:10px;align-items:center;margin:6px 0}
.funnel .bar{height:26px;background:var(--brand);border-radius:6px;min-width:2px}
.funnel .lab{font-size:13px}
.funnel .num{font-size:12px;color:var(--muted)}
a{color:var(--brand-ink)}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
table.eq tr.sel td{background:var(--soft);box-shadow:inset 0 -2px 0 var(--brand)}
.gbar{display:flex;gap:6px;align-items:flex-end;height:90px;margin:6px 0 2px}.gbar .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}.gbar .stk{width:70%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden}
/* estado: colores fijos (validados), siempre con ícono */
:root{--st-good:#0ca30c;--st-warn:#fab219;--st-bad:#d03b3b}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px}
.tile .l{font-size:13px;color:var(--muted);font-weight:600}
.tile .vrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tile .v{font-size:36px;font-weight:650;line-height:1.05}
.tile .of{font-size:16px;color:var(--muted);font-weight:500}
.tile .m{font-size:12px;color:var(--muted)}
.tile.go{cursor:pointer}.tile.go:hover{border-color:var(--brand)}
.stt{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;color:var(--ink);padding:1px 9px 1px 3px;border-radius:999px;background:var(--soft)}
.stt i,.ico{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-style:normal;font-size:10px;font-weight:800;color:#fff;vertical-align:-3px}
.good i,.ico.good{background:var(--st-good)}.warn i,.ico.warn{background:var(--st-warn);color:#0b0b0b}.bad i,.ico.bad{background:var(--st-bad)}.na i,.ico.na{background:var(--s4)}
td.c-good{background:var(--okbg)}td.c-warn{background:var(--warnbg)}td.c-bad{background:var(--badbg)}td.c-na{color:var(--muted)}
.sec{margin:22px 0 8px;font-size:15px;font-weight:650}
.mx td,.mx th{padding:9px 10px}.mx tr.sel td{box-shadow:inset 0 -2px 0 var(--brand)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:2px 0 16px}
.hero .big{font-size:52px;font-weight:650;line-height:1;color:var(--ink)}
.hero .what{font-size:15px;max-width:640px}
.hero.sm{margin:4px 0 10px}.hero.sm .big{font-size:34px}.hero.sm .what{font-size:13px;color:var(--muted)}
.frow{display:grid;grid-template-columns:minmax(120px,190px) 1fr minmax(110px,170px);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:none}.frow.sm{padding:6px 0}
table.coht td,table.coht th{padding:5px 8px}table.coht td.coh{vertical-align:top;white-space:nowrap}table.coht tr.ctop td{border-top:2px solid var(--line)}
table.stair td,table.stair th{padding:6px 8px;text-align:center;white-space:nowrap}.mlist{max-width:720px}.mrow{padding:6px 8px;border-radius:8px}.mrow.on{background:var(--line)}.mrow.click{cursor:pointer}.mlab{font-size:14px;margin-bottom:3px}.mbar{display:flex;align-items:center;gap:8px}.mbar .fbar{height:14px;border-radius:4px;min-width:3px}.mbar span{font-size:13px;white-space:nowrap}.zoomc{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.zg{margin:10px 0}.zgh{display:grid;grid-template-columns:minmax(150px,260px) 1fr auto;gap:10px;align-items:center}.zg ul{margin:4px 0 0 18px;padding:0}.zg li{margin:3px 0;font-size:13px}@media(max-width:600px){.zgh{grid-template-columns:1fr auto}.zgh .mbar{display:none}}
table.stair tr.click{cursor:pointer}table.stair tr.click:hover td.l{text-decoration:underline}table.stair tr.selrow td.l,table.stair tr.selrow td.n0{background:var(--brand);color:#fff}
table.stair th.hoy,table.stair td.hoy{border-left:2px solid var(--ink);border-right:2px solid var(--ink)}table.stair td.n0{background:var(--soft,#eef7f6);font-weight:600}td.st{background:color-mix(in srgb,var(--brand) calc(var(--a,0)*85%),transparent);font-variant-numeric:tabular-nums}td.st.na{color:var(--muted);background:none}td.st.low{color:var(--muted);background:none}.cohctl{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:10px}.chipb.on{background:var(--brand);color:#fff;border-color:var(--brand)}.frow.click{cursor:pointer}.frow.click:hover{background:var(--line)}
td.hm{text-align:center;min-width:64px;background:color-mix(in srgb,var(--brand) calc(var(--a,0)*55%),transparent)}td.hm.na{color:var(--muted);font-size:11px;background:none}td.hm.low{color:var(--muted);background:none}.brandtx{font-weight:600}
.frow.worst{background:linear-gradient(90deg,var(--badbg),transparent 70%);border-radius:8px}
.ftrack{position:relative;height:14px;background:var(--soft);border-radius:4px}
.fbar{height:100%;background:var(--brand);border-radius:4px;min-width:2px}
.goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.fnum{text-align:right;font-size:13px}
.hb{display:flex;gap:2px;height:10px;min-width:4px}.hb.clip{-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent)}.carga .hbw{flex:1;min-width:120px}.hb i{display:block;height:100%;border-radius:3px}
.carga{display:flex;align-items:center;gap:8px}.carga .hb{flex:0 1 auto}
.actr{display:grid;grid-template-columns:70px 1fr 120px;gap:8px;align-items:center;margin:3px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chipb{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:5px 12px}
.chipb.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
details summary{cursor:pointer}
.spk{flex:none}
.grid>*,.tiles>*{min-width:0}
.card{overflow-x:auto}
@media (max-width:640px){header,main{padding-left:16px;padding-right:16px}.two{grid-template-columns:1fr}.frow{grid-template-columns:100px 1fr 90px}.hero .big{font-size:40px}.tile .v{font-size:30px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Alegra Connect · tablero integral</h1>
    <span class="sub" id="corte"></span>
    <span class="sp"></span>
    <button id="theme" title="Cambiar tema">◐</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="filters">
    <label>País <select id="fPais"><option>Todos</option><option>COL</option><option>MEX</option><option>DOM</option><option>CRI</option><option>Otro</option></select></label>
    <label>Segmento <select id="fSeg"><option>Todos</option><option>Contador</option><option>Pyme</option><option>Sin segmento</option></select></label>
    <label>Analista <select id="fOw"><option>Todos</option></select></label>
    <label>Pipeline <select id="fPipe"><option value="T">Ambos</option><option value="N">Adopción New</option><option value="O">Viejo (Connect)</option></select></label>
    <label class="fecha">Desde <select id="fDesde"></select></label>
    <label class="fecha">Hasta <select id="fHasta"></select></label>
    <span class="sub" id="fNota"></span>
  </div>
</header>
<main id="main"></main>
<script>
const DATA = /*__DATA__*/null;
const TODAY = DATA.corte.slice(0,10);
const MES_ACT = TODAY.slice(0,7);
const HS = id => `https://app.hubspot.com/contacts/6180490/record/2-40542822/${id}`;
const ORD = {NEW:0,WORK:1,KICK:2,SOL:3,PROC:4,CIC:5,CIE:6};
const LAB = {NEW:'New (bandeja)',WORK:'Working',KICK:'Kick-off',SOL:'Solicitud de información',PROC:'Proceso de migración',CIC:'Ciclo de adopción',CIE:'Cierre',NC:'No completado',
  O_NUEVO:'Viejo · Nuevo',O_PROC:'Viejo · En proceso',O_COMP:'Viejo · Completada',O_NC:'Viejo · No completada'};
const META_AGENDA = 2, META_MIG = 6; // días hábiles

// ---------- utilidades de fechas ----------
const D = s => new Date(s+'T00:00:00Z');
function cd(a,b){return Math.round((D(b)-D(a))/864e5)}
function bd(a,b){ // días hábiles (lun-vie) de a a b; sin festivos
  if(!a||!b) return null; let s=D(a), e=D(b), sign=1; if(e<s){[s,e]=[e,s];sign=-1}
  const tot=Math.round((e-s)/864e5); const w=Math.floor(tot/7); let n=w*5; const sd=s.getUTCDay();
  for(let i=1;i<=tot%7;i++){const dd=(sd+i)%7; if(dd!==0&&dd!==6)n++}
  return n*sign;}
const med = a => {if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pct = (a,q) => {if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(q*(s.length-1)+0.5))]};
const f0 = v => v==null?'–':Number(v).toLocaleString('es-CO',{maximumFractionDigits:1});
const fp = (n,d) => d? (100*n/d).toFixed(0)+'%' : '–';
const mes = s => s? s.slice(0,7):null;
const MESN = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mlab = m => MESN[+m.slice(5,7)-1]+' '+m.slice(2,4);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const info = t => `<span class="info" title="${esc(t)}">i</span>`;

// ---------- derivar cada registro (una sola vez) ----------
for(const r of DATA.recs){
  const d=r.d;
  if(r.p==='N'){
    const ws=['WORK','KICK','SOL','PROC','CIC','CIE','NC'].map(k=>d[k]).filter(Boolean).sort();
    r.ing = ws[0] || null;                 // entrada al universo = primera etapa de trabajo
    r.band = !r.ing;                       // sigue solo en New: no califica por plan
    if(r.band) r.ing = r.cre;
    r.fin = r.st==='CIE'? (d.CIE||r.cre):null;
    r.ncd = r.st==='NC'? (d.NC||r.cre):null;
    const maxo = Math.max(...Object.keys(d).filter(k=>k in ORD).map(k=>ORD[k]),0);
    r.reach = k => !!d[k] || (r.st!=='NC' && ORD[r.st]>ORD[k]) || (r.st==='NC' && maxo>=ORD[k]);
    r.open = !r.band && ['WORK','KICK','SOL','PROC','CIC'].includes(r.st);
    r.since = d[r.st] || r.ing;
  } else {
    r.ing = r.sol; r.band=false;
    r.fin = r.st==='O_COMP'? (d.O_COMP||r.cre):null;
    r.ncd = r.st==='O_NC'? (d.O_NC||r.cre):null;
    r.open = r.st==='O_NUEVO'||r.st==='O_PROC';
    r.since = d[r.st] || r.ing;
  }
  r.dEt = r.open? bd(r.since,TODAY):null;
  // Alertas (reglas acordadas 2026-10-27/29)
  r.al=''; r.alN=0;
  if(r.open && r.p==='N'){
    if(r.st==='WORK' && bd(d.WORK||r.ing,TODAY)>META_AGENDA){r.al='Sin agendar > 48 h hábiles';r.alN=2;r.alD='Sales'}
    if(r.st==='SOL' && bd(d.SOL,TODAY)>META_MIG){r.al='Esperando info > 6 hábiles';r.alN=3;r.alD='Sales'}
    if(r.st==='PROC' && bd(d.PROC,TODAY)>META_MIG){r.al='SLA migración vencido';r.alN=4;r.alD='Analista'}
    if(r.st==='CIC' && bd(d.CIC,TODAY)>15){r.al='Ciclo de adopción > 15 hábiles';r.alN=1;r.alD='Analista'}
    if(!r.ow && ORD[r.st]>=ORD.KICK){r.al=(r.al?r.al+' · ':'')+'Sin owner';r.alN=Math.max(r.alN,3)}
  }
  if(r.open && r.p==='O' && cd(r.ing,TODAY)>60){r.al='Backlog viejo > 60 días';r.alN=1;r.alD='Analista'}
  // Tramos del pipeline nuevo (solo con ambas fechas)
  if(r.p==='N' && !r.retro){
    r.t={};
    const pairs={T1:['WORK','KICK'],T2:['KICK','SOL'],T3:['SOL','PROC'],T4:['PROC','CIC'],T5:['CIC','CIE']};
    for(const [k,[a,b]] of Object.entries(pairs)) if(d[a]&&d[b]) r.t[k]=[bd(d[a],d[b]),cd(d[a],d[b]),d[b]];
    if(r.fin && !r.band) r.t.TT=[bd(r.ing,r.fin),cd(r.ing,r.fin),r.fin];
  }
  // SLA de migración (método acordado 21/29-oct, el mismo del tablero TMS México):
  // nuevo = reloj desde Proceso de migración (o, si se la saltó, desde la primera etapa de trabajo) hasta Ciclo o Cierre;
  // viejo = solo tickets de MIGRACIÓN por título, desde fecha de solicitud hasta fecha de finalización (o Completada).
  // r.mig = [días háb., días calend., fecha de entrega, fuente]
  r.mig=null; r.venceD=null;
  if(r.p==='N' && !r.retro && !r.band){
    const ini=d.PROC||r.ing, fe=[d.CIC,d.CIE].filter(Boolean).sort()[0];
    if(fe) r.mig=[bd(ini,fe),cd(ini,fe),fe,d.PROC?'NP':'NS'];
    else if(r.open) r.venceD=d.SOL||d.PROC||null;   // abierto: vence desde que se pidió la info
  }
  if(r.p==='O' && r.tp==='M' && r.st==='O_COMP'){
    const fe=r.ff||d.O_COMP||r.cre; if(fe>=r.sol) r.mig=[bd(r.sol,fe),cd(r.sol,fe),fe,'OM'];
  }
}
const MIGSRC={OM:'Pipeline viejo · tickets de migración',NP:'Adopción New · pasó por Proceso de migración',NS:'Adopción New · sin Proceso de migración (reloj desde Working)'};

// ---------- filtros ----------
const $=id=>document.getElementById(id);
const meses=[];{let m='2026-01';while(m<=MES_ACT){meses.push(m);let [y,mm]=m.split('-').map(Number);mm++;if(mm>12){mm=1;y++}m=y+'-'+String(mm).padStart(2,'0')}}
for(const m of meses){$('fDesde').add(new Option(mlab(m),m));$('fHasta').add(new Option(mlab(m),m))}
$('fDesde').value=meses[Math.max(0,meses.length-3)];$('fHasta').value=MES_ACT;
[...new Set(DATA.recs.filter(r=>r.ow&&!r.band).map(r=>r.ow))].sort().forEach(o=>$('fOw').add(new Option(o)));
$('fOw').add(new Option('(sin owner)'));
$('corte').textContent='Datos de HubSpot al '+DATA.corte.replace('T',' ').slice(0,16)+' · mes en curso = parcial';
const F=()=>({pais:$('fPais').value,seg:$('fSeg').value,ow:$('fOw').value,pipe:$('fPipe').value,desde:$('fDesde').value,hasta:$('fHasta').value});
function base(f,{ignOw}={}){return DATA.recs.filter(r=>(f.pais==='Todos'||r.pa===f.pais)&&(f.seg==='Todos'||r.seg===f.seg)&&(f.pipe==='T'||r.p===f.pipe)&&
  (ignOw||f.ow==='Todos'||(f.ow==='(sin owner)'?!r.ow:r.ow===f.ow)))}
const inR=(f,dt)=>dt&&mes(dt)>=f.desde&&mes(dt)<=f.hasta;
const mesesR=f=>meses.filter(m=>m>=f.desde&&m<=f.hasta);

// ---------- gráficas SVG ----------
function bars(series,cats,{h=220,fmt=f0,stack=false,partial=null}={}){
  const W=Math.max(420,cats.length*64),P={l:34,r:8,t:10,b:28},iw=W-P.l-P.r,ih=h-P.t-P.b;
  const max=Math.max(1,...cats.map((_,i)=>stack?series.reduce((s,se)=>s+(se.v[i]||0),0):Math.max(...series.map(se=>se.v[i]||0))));
  const gw=iw/cats.length,bw=stack?gw*0.6:gw*0.8/series.length;let g='';
  for(let t=0;t<=4;t++){const y=P.t+ih-ih*t/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-4}" y="${y+4}" text-anchor="end">${Math.round(max*t/4)}</text>`}
  cats.forEach((c,i)=>{let acc=0;series.forEach((se,j)=>{const v=se.v[i]||0,bh=ih*v/max;
    const x=stack?P.l+gw*i+gw*0.2:P.l+gw*i+gw*0.1+bw*j,y=stack?P.t+ih-acc-bh:P.t+ih-bh;acc+=stack?bh:0;
    const op=partial&&c===partial?0.45:1;

// ===== Equipo: ¿cómo rinde cada analista? =====
// Scorecard acordado con Jhonatan 2026-11-10. Cuatro números por analista:
//  1. Onboardeados/mes: empresas únicas llevadas a Cierre (Adopción New) o Completada (viejo), por fecha de cierre.
//  2. Completa a 60 días: cohorte = mes de la primera sesión REALIZADA; a los 60 días se mira el estado:
//     onboardeado ÷ (onboardeado + abandonos que le tocan al analista). Abandono = No completado después de una sesión.
//     Abandono en «Solicitud de información» (esperando info) le toca a Sales / cliente, no al analista.
//     Los que siguen abiertos a los 60 días quedan aparte («en curso»). Solo cohortes que ya cumplieron 60 días.
//  3. Migración ≤ 6 días hábiles (método SLA ya acordado).
//  4. Activación de lo onboardeado: ≥1 evento de valor entre el inicio del mes de cierre y el fin del mes siguiente (Metabase).

// estado de la cohorte a los 60 días de la primera sesión realizada

  const on=x.filter(r=>inR(f,r.fin)),c=uniq(on);

  const ch=x.filter(r=>r.s1&&!r.retro&&inR(f,r.s1)&&addD(r.s1,EDAD)<=TODAY).map(coh);
  const k={ok:0,abA:0,abS:0,cur:0};ch.forEach(s=>k[s]++);
  const am=on.filter(r=>r.act!=null&&actMad(r)),aOk=uniq(am.filter(r=>r.act)),aN=uniq(am);
  const nc=x.filter(r=>inR(f,r.ncd)),ab=uniq(nc.filter(r=>r.sh)),s0=uniq(nc.filter(r=>!r.sh)),sinMot=nc.filter(r=>!r.mot).length;
  return {c,cm:nm?c/nm:null,del:del.length,sla:del.length?100*ok/del.length:null,md:med(del.map(r=>r.mig[0])),
    k,cn:k.ok+k.abA,comp:k.ok+k.abA?100*k.ok/(k.ok+k.abA):null,aN,act:aN?100*aOk/aN:null,
